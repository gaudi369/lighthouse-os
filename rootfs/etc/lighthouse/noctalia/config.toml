# Loaded via NOCTALIA_CONFIG_HOME=/etc/lighthouse (set in /etc/niri/config.kdl),
# so the kid's session uses this system-owned config.
[theme]
mode    = "dark"
source  = "builtin"
builtin = "Catppuccin"

[bar.default]
position  = "top"
thickness = 48
start     = ["launcher"]
center    = ["clock"]
end       = ["volume", "battery"]

[shell]
# The kid should land straight on the desktop: no setup wizard, no phoning home.
setup_wizard_enabled = false
telemetry_enabled    = false

[storage]
# The kid account has no password, so there is no keyring to unlock at login.
key_source = "file"
key_file   = "~/.local/state/noctalia/storage.key"
